# Single source of truth for run mode, symbols, strategy instances, regime filter and risk.
# Read by both Python (services/research) and TypeScript (apps/engine, apps/dashboard).
# Changing a timeframe or parameter is a config edit + restart, never a code change.

mode: shadow # shadow | paper | testnet | live

symbols:
  - BTCUSDT

strategies:
  - id: s1_btc_15m
    type: sr_bounce
    symbol: BTCUSDT
    entry_tf: 15m
    regime_tf: 1h
    enabled: true
    params:
      swing_width: 5 # bars either side for a swing high/low on the regime timeframe
      level_tolerance_pct: 0.25 # cluster swings within this % into one level
      level_min_touches: 2
      level_lookback_days: 30
      level_break_pct: 0.5 # regime close this far below a level invalidates it
      touch_pct: 0.3 # candle low within this % of a support level
      wick_min_pct: 50 # lower wick as % of candle range
      rsi_len: 14
      rsi_max: 45
      atr_len: 14
      stop_below_level_pct: 0.25
      stop_atr_buffer: 0.1
      max_risk_pct: 1.5 # skip if (entry - stop) / entry exceeds this
      min_r: 1.5 # skip if projected R below this
      max_fee_r: 0.25 # skip if round-trip fees would eat more than this many R (fee_pct from exit)
      invalidation_pct: 0.0 # regime close this % below the level closes the trade
    exit:
      tp1_r: 1.0
      tp1_fraction: 0.5
      breakeven_r: 1.0
      trail_atr_k: 2.0
      tp_ratchet_atr: 1.0
      fee_pct: 0.1
      max_bars: null

regime:
  ema_fast: 50
  ema_slow: 200
  atr_len: 14
  atr_pct_min: 0.3
  atr_pct_max: 3.0
  no_trade_minutes_after_daily_open: 15

risk:
  per_trade_pct: 1.0
  daily_loss_pct: 3.0
  max_open: 3
  max_per_symbol: 1
  consecutive_loss_cooldown: 3
  cooldown_minutes: 120
  notional_cap_pct: 25.0

paper:
  starting_balance: 10000
  slippage_pct: 0.05
  fee_pct: 0.1
