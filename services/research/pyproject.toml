[project]
name = "research"
version = "0.1.0"
description = "Ingest, indicators, strategies, backtesting and live signal runner"
requires-python = ">=3.10"
dependencies = [
    "ccxt>=4.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.1",
    "typer>=0.12",
    "rich>=13.8",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.7.2",
]

[project.optional-dependencies]
research = ["optuna>=4.0"]

[project.scripts]
research = "research.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "datamodel-code-generator>=0.26", "jsonschema>=4.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["research/contracts/gen.py"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
ignore = ["B008"]  # typer.Option in defaults is the documented typer pattern

[tool.pytest.ini_options]
testpaths = ["tests"]
